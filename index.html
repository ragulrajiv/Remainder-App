<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basic E-Commerce</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="auth-section">
      <h2>Login or Register</h2>
      <form id="auth-form">
        <input type="email" id="email" placeholder="Email" required />
        <input type="password" id="password" placeholder="Password" required />
        <button type="submit" id="login-btn">Login</button>
        <button type="button" id="register-btn">Register</button>
      </form>
    </div>

    <div id="home-section" style="display: none">
      <h2>Welcome to the Store</h2>
      <div id="products"></div>
      <button id="view-cart-btn">View Cart</button>
    </div>

    <div id="cart-section" style="display: none">
      <h2>Your Cart</h2>
      <ul id="cart-items"></ul>
      <p>Total: $<span id="cart-total">0</span></p>
      <button id="checkout-btn">Place Order</button>
      <button id="back-to-home-btn">Back to Home</button>
    </div>

    <div id="checkout-section" style="display: none">
      <h2>Checkout</h2>
      <form id="payment-form">
        <label>Payment Method:</label>
        <select id="payment-method">
          <option value="credit">Credit Card</option>
          <option value="paypal">PayPal</option>
          <option value="cash">Cash on Delivery</option>
        </select>
        <button type="submit">Complete Order</button>
      </form>
      <button id="back-to-cart-btn">Back to Cart</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
